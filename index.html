<title>SinRutina · Ahora</title>
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface2:#F7F7FA;
  --ink:#1C1C1E;
  --muted:#6E6E73;
  --line:#D9D9DE;
  --accent:#7FAEEA;
  --accent-ink:#3478B8;
  --accent-soft:#EAF4FF;
  --start:#6F9FDF;
  --note:#EDF6FF;
  --success:#79C8A2;
  --warning:#F0B86D;
  --danger:#E58B90;
  --radius:14px;
  --page-x:18px;
  --font-scale:1;
  --body-weight:400;
  --strong-weight:620;
  --dock-space:78px;
  --tap:44px;
  --control-h:44px;
  --control-r:10px;
  --control-x:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--ink);font-size:calc(17px * var(--font-scale));font-weight:var(--body-weight);letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:default}svg{display:block}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}.app-shell{height:100dvh;min-height:100%;position:relative;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 12px) var(--page-x) calc(var(--dock-space) + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar,.sheet::-webkit-scrollbar,.ai-tabs::-webkit-scrollbar{display:none}

/* Home */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:8px 0 20px}.home-titles{min-width:0}.app-label{display:block;font-size:13px;line-height:1.2;color:var(--muted);font-weight:520;margin-bottom:5px}.home-head h1,.section-head h1{margin:0;font-size:36px;line-height:.98;letter-spacing:-1.25px;font-weight:720;color:var(--ink)}.home-date{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.3}.top-more,.header-btn{width:44px;height:44px;border:0;background:transparent;color:var(--accent-ink);display:grid;place-items:center;border-radius:14px;padding:0}.top-more:active,.header-btn:active{background:var(--surface2)}.top-more svg,.header-btn svg{width:23px;height:23px}
.now-view{display:flex;flex-direction:column}.now-stage{width:100%;max-width:620px;margin:4px auto 0;background:var(--note);border-radius:calc(var(--radius) + 1px);padding:18px 16px 14px;min-height:274px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.now-stage.empty{background:var(--surface);border:1px solid var(--line)}
.now-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.kind-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--task-ink,var(--accent-ink));font-weight:600}.kind-label i{width:8px;height:8px;border-radius:50%;background:var(--task-accent,var(--accent))}.task-more{width:40px;height:40px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:12px;padding:0}.task-more:active{background:color-mix(in srgb,var(--surface) 42%,transparent)}.task-more svg{width:21px;height:21px}
.now-task-copy{padding:22px 0 20px;text-align:center}.now-task-title{margin:0 auto;font-size:30px;line-height:1.1;letter-spacing:-.9px;font-weight:var(--strong-weight);max-width:20ch;overflow-wrap:anywhere}.task-reason{margin:11px auto 0;font-size:14px;line-height:1.4;color:var(--muted);max-width:46ch}.now-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}.now-estimate{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:5px;text-align:center}.start-btn{width:max-content;min-width:128px;max-width:184px;height:var(--control-h);padding:0 18px;border:0;border-radius:var(--control-r);background:var(--start);color:white;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:620;line-height:1;box-shadow:none;align-self:center;justify-self:center}.start-btn svg{width:18px;height:18px}.saturated-btn{width:max-content;max-width:100%;min-height:var(--tap);padding:0 12px;border:0;background:transparent;color:var(--accent-ink);font-size:15px;font-weight:540;border-radius:var(--control-r);align-self:center;justify-self:center}.saturated-btn:active{background:color-mix(in srgb,var(--surface) 36%,transparent)}
.home-context{max-width:660px;width:100%;margin:16px auto 0}.context-row{width:100%;min-height:64px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:12px;padding:8px 2px;text-align:left}.context-copy{display:grid;gap:2px}.context-copy strong{font-size:15px;font-weight:580}.context-copy small{font-size:13px;color:var(--muted)}.context-value{font-size:13px;color:var(--muted);white-space:nowrap}.context-row>svg{width:18px;height:18px;color:#B0B2B8}
.empty-copy{padding:28px 0 24px;text-align:center}.empty-copy h2{margin:0 auto;font-size:29px;line-height:1.1;letter-spacing:-.75px;font-weight:var(--strong-weight);max-width:20ch}.empty-copy p{margin:12px auto 0;color:var(--muted);font-size:15px;line-height:1.42;max-width:42ch}.empty-capture{width:max-content;min-width:138px;max-width:200px;height:var(--control-h);padding:0 16px;border:0;border-radius:var(--control-r);background:var(--accent-soft);color:var(--accent-ink);font-size:15.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;align-self:center}.empty-capture svg{width:20px;height:20px}

/* Floating, opaque navigation pill */
.dock{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%)!important;width:min(296px,calc(100% - 32px));height:56px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:1fr 48px 1fr;align-items:center;padding:5px 6px;z-index:20;box-shadow:0 5px 18px rgba(20,25,35,.07)}
.nav-btn{height:var(--tap);border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-size:11.5px;font-weight:550;padding:0 7px;min-width:0}.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--accent-ink);background:var(--accent-soft)}.capture-btn{justify-self:center;width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;box-shadow:none}.capture-btn svg{width:20px;height:20px}

/* Trays */
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:9px 0 20px}.section-head p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.35}.section-head-left{display:flex;align-items:flex-start;gap:4px;min-width:0}.back-btn{width:var(--tap);height:var(--tap);border:0;background:transparent;color:var(--accent-ink);display:grid;place-items:center;padding:0;margin-left:-8px;border-radius:11px;flex:none}.back-btn:active{background:var(--surface2)}.back-btn svg{width:22px;height:22px;transform:rotate(180deg)}
.tray-intro{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.4}.tray-group,.task-list,.settings-group,.action-list,.color-list{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.tray-row{width:100%;min-height:70px;border:0;border-bottom:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:38px minmax(0,1fr) auto 18px;align-items:center;gap:12px;padding:10px 13px;text-align:left}.tray-row:last-child{border-bottom:0}.tray-row:active,.task-row:active,.setting-row:active,.action-item:active{background:var(--surface2)}.tray-icon,.task-symbol,.setting-icon{width:34px;height:34px;border-radius:10px;background:var(--row-soft,var(--accent-soft));color:var(--row-ink,var(--accent-ink));display:grid;place-items:center}.tray-icon svg,.task-symbol svg,.setting-icon svg{width:18px;height:18px}.tray-copy,.task-row-copy,.setting-copy,.action-copy{display:grid;gap:3px;min-width:0}.tray-copy strong,.task-row-copy strong{font-size:16px;line-height:1.18;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tray-copy small,.task-row-copy small{font-size:13px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tray-count{min-width:26px;text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.tray-row>svg,.task-row>svg{width:18px;height:18px;color:#B2B4BA}

/* ===== SinRutina 2026 · White / Liquid / Pastel redesign ===== */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#14151A; --muted:#767983;
  --line:rgba(35,39,47,.10); --page-x:20px; --dock-space:88px; --control-r:14px;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88);
}
html,body,#app,.app-shell{background:#fff}
body{font-weight:390;letter-spacing:-.012em}
body[data-weight="light"]{--body-weight:350;--strong-weight:560}
body[data-weight="regular"]{--body-weight:400;--strong-weight:600}
body[data-weight="semibold"]{--body-weight:430;--strong-weight:650}
button{-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 34%,transparent);outline-offset:2px}
body[data-motion="full"] .start-btn,body[data-motion="full"] .capture-btn,body[data-motion="full"] .nav-btn,body[data-motion="full"] .saturated-card,body[data-motion="full"] .task-row,body[data-motion="full"] .tray-tab{transition:transform .16s ease,background-color .16s ease,box-shadow .16s ease,opacity .16s ease}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.view{padding:calc(env(safe-area-inset-top) + 12px) var(--page-x) calc(var(--dock-space) + env(safe-area-inset-bottom));background:#fff}
.home-head,.section-head{padding-top:10px;padding-bottom:24px}
.app-label{font-size:12px;line-height:1.2;text-transform:none;letter-spacing:.01em;color:#9A9DA5;font-weight:500;margin-bottom:6px}
.home-head h1,.section-head h1{font-size:38px;line-height:.98;letter-spacing:-1.55px;font-weight:580;color:var(--ink)}
.home-date,.section-head p{font-size:13.5px;color:var(--muted);margin-top:8px}
.glass-control,.top-more,.header-btn{background:var(--glass);border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 22px rgba(32,38,50,.06);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);color:#69717E;border-radius:15px}

/* Now */

/* ===== SinRutina · Vivid Fixed Header 2026 ===== */
:root{
  --page-x:22px;
  --font-scale:1.025;
  --dock-space:96px;
  --tap:46px;
  --control-h:46px;
  --accent:#67A9FF;
  --accent-ink:#2F78D4;
  --accent-soft:#E8F3FF;
  --start:#4E92EF;
}

/* App content starts at the top safe-area. Headers stay physically anchored. */
.view{padding:0 var(--page-x) calc(var(--dock-space) + env(safe-area-inset-bottom));}
.home-head,.section-head{
  position:sticky;
  top:0;
  z-index:18;
  margin:0 calc(-1 * var(--page-x)) 14px;
  padding:calc(env(safe-area-inset-top) + 7px) var(--page-x) 13px;
  min-height:92px;
  background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.96) 82%,rgba(255,255,255,.88) 100%);
  border-bottom:1px solid rgba(39,45,55,.055);
  backdrop-filter:blur(18px) saturate(145%);
  -webkit-backdrop-filter:blur(18px) saturate(145%);
}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:14px}

function rebuildMemoryProfile(){

 const typeCounts={},durations={},hours={},wordCounts={};

 const top=(obj,n=3)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([key,count])=>({key,count}));

function remember(type,data={}){if(!memory.enabled)return;memory.events.push({id:uid('mem'),at:nowISO(),type,data});memory.events=memory.events.slice(-500);rebuildMemoryProfile()}
function learnWriting(mode,finalText,originalText=''){if(!memory.enabled||!memory.storeWriting)return;const final=String(finalText||'').trim();if(final.length<12)return;const last=memory.writingSamples[memory.writingSamples.length-1];if(last?.final===final&&last?.mode===mode)return;memory.writingSamples.push({id:uid('style'),at:nowISO(),mode,final:final.slice(0,6000),original:String(originalText||'').slice(0,6000),edited:String(originalText||'').trim()!==final});memory.writingSamples=memory.writingSamples.slice(-50);rebuildMemoryProfile()}
function memoryPrompt(mode,includeExamples=false){if(!memory.enabled)return'';const p=memory.profile?.writing?.samples!==undefined?memory.profile:rebuildMemoryProfile(),w=p.writing||{},t=p.tasks||{};const labels={email:'correo',whatsapp:'WhatsApp',steps:'planificación',decide:'decisiones',summary:'resúmenes'};let lines=['MEMORIA LOCAL DE SINRUTINA — úsala solo como preferencia del usuario, no como contenido factual.'];if(w.samples){lines.push(`Estilo observado: ${w.lengthLabel}; promedio ${w.avgWords} palabras y ${w.avgParagraphs} párrafos; apertura habitual ${w.opening}; cierre habitual ${w.closing}.`)}if(t.topTemplates?.length)lines.push(`Tareas frecuentes: ${t.topTemplates.map(x=>templates[x.key]?.label||x.key).join(', ')}.`);if(t.keywords?.length)lines.push(`Palabras/temas recurrentes en tareas: ${t.keywords.map(x=>x.key).join(', ')}.`);const d=Object.entries(t.actualByTemplate||{}).filter(([,v])=>v.count>=2).map(([k,v])=>`${templates[k]?.label||k} ~${v.avg} min reales`);if(d.length)lines.push(`Tiempos aprendidos: ${d.slice(0,4).join('; ')}.`);if(includeExamples&&['email','whatsapp'].includes(mode)){const ex=(memory.writingSamples||[]).filter(x=>x.mode===mode).slice(-2);if(ex.length)lines.push(`Ejemplos recientes del estilo (${labels[mode]||mode}):\n${ex.map((x,i)=>`Ejemplo ${i+1}: ${x.final.slice(0,700)}`).join('\n')}`)}return lines.join('\n')}
function calibratedEstimate(r){if(!memory.enabled)return r;const h=memory.profile?.tasks?.actualByTemplate?.[r.template];if(!h||h.count<2||!h.avg)return r;const blended=Math.max(2,Math.min(480,Math.round((Number(r.minutes)*0.6+h.avg*0.4)/5)*5));return{...r,minutes:blended,reason:`${r.reason} Ajustado con ${h.count} tiempos reales tuyos.`}}
function memoryTaskBoost(t){if(!memory.enabled)return 0;const p=memory.profile?.tasks||{},hour=new Date().getHours();let b=0;if((p.preferredHours||[]).some(x=>Number(x.key)===hour))b+=4;if((p.topTemplates||[]).slice(0,2).some(x=>x.key===t.template))b+=2;return b}
rebuildMemoryProfile();
function showToast(msg){ui.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast='';render()},2300)}
function formatDate(){let s=new Intl.DateTimeFormat('es-CL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());return s.charAt(0).toUpperCase()+s.slice(1)}
function energyLabel(){return prefs.energy==='baja'?'energía baja':prefs.energy==='alta'?'energía alta':'energía media'}
function taskScore(t){
 let s=t.priority==='high'?55:t.priority==='low'?4:20;
 const av=Number(prefs.available)||25; if(t.duration<=av)s+=26-Math.max(0,av-t.duration)*.15; else s-=Math.min(38,(t.duration-av)*1.25);
 const e=prefs.energy==='baja'?1:prefs.energy==='alta'?3:2, req=templates[t.template]?.energy||2; s-=Math.max(0,req-e)*20; if(e===1&&t.duration<=10)s+=12;
 if(t.dueAt){const d=new Date(t.dueAt)-Date.now(); if(d<0)s+=80; else if(d<86400000)s+=45; else if(d<3*86400000)s+=20}
 const age=Math.min(10,Math.max(0,(Date.now()-new Date(t.createdAt).getTime())/86400000));s+=age;
 s+=memoryTaskBoost(t);
 return s;
}
function eligible(){return tasks.filter(t=>!t.completed&&!['waiting','read','someday'].includes(t.bucket))}
function currentTask(){const pinned=tasks.find(t=>!t.completed&&t.bucket==='now'); if(pinned)return pinned;return [...eligible()].sort((a,b)=>taskScore(b)-taskScore(a))[0]||null}
function taskReason(t){if(!t)return'';let p=[];if(t.priority==='high')p.push('prioridad alta');if(t.duration<=prefs.available)p.push(`cabe en ${prefs.available} min`);if(prefs.energy==='baja'&&t.duration<=15)p.push('es abordable con poca energía');if(t.dueAt&&new Date(t.dueAt)-Date.now()<86400000)p.push('vence pronto');return p.length?`${p.slice(0,2).join(' · ')}`:'elegida para reducir decisiones'}
function selectAsNow(id){const n=nowISO();tasks=tasks.map(t=>t.id===id?{...t,bucket:'now',updatedAt:n}:t.bucket==='now'&&!t.completed?{...t,bucket:'later',updatedAt:n}:t);persist()}
function ensureNow(){const t=currentTask();if(t&&t.bucket!=='now')selectAsNow(t.id)}
function changeTask(){const cur=currentTask();const candidates=[...eligible()].filter(t=>t.id!==cur?.id).sort((a,b)=>taskScore(b)-taskScore(a));if(!candidates.length)return showToast('No hay otra tarea lista todavía');selectAsNow(candidates[0].id);ui.sheet=null;showToast('Te dejé otra opción')}
function completeTask(id,actualMinutes=null){const before=tasks.find(t=>t.id===id);if(before)remember('task_completed',{id,title:before.title,template:before.template,estimatedMinutes:before.duration,actualMinutes:actualMinutes||undefined,hour:new Date().getHours()});tasks=tasks.map(t=>t.id===id?{...t,completed:true,completedAt:nowISO(),actualMinutes:actualMinutes||t.actualMinutes,updatedAt:nowISO()}:t);persist();if(ui.taskId===id)ui.sheet=null;ensureNow();showToast('Hecho. Fuera de tu cabeza.')}
function postponeTask(id,minutes=60){const before=tasks.find(t=>t.id===id);if(before)remember('task_postponed',{id,title:before.title,template:before.template,minutes,hour:new Date().getHours()});tasks=tasks.map(t=>t.id===id?{...t,bucket:'later',dueAt:new Date(Date.now()+minutes*60000).toISOString(),updatedAt:nowISO()}:t);persist();ui.sheet=null;ensureNow();showToast(minutes===60?'Lo saco del camino por una hora':'Queda para después')}
function deleteTask(id){const before=tasks.find(t=>t.id===id);if(before)remember('task_deleted',{id,title:before.title,template:before.template});deleted[id]=nowISO();tasks=tasks.filter(t=>t.id!==id);persist();ui.sheet=null;ensureNow();showToast('Eliminado')}
function firstStep(t){const m={email:'Abre el correo y escribe solo la primera línea.',document:'Abre el documento y deja escrito el primer dato.',errand:'Deja listo lo que necesitas para salir o pagar.',appointment:'Abre el contacto y prepara la confirmación.',message:'Abre la conversación y escribe una frase.',decision:'Escribe dos criterios. No decidas todavía.',general:'Abre solo lo necesario y haz el primer movimiento.'};return m[t.template]||m.general}
function themeFor(t){const key=t?.template||'general',base=templates[key]||templates.general,c=prefs.templateColors?.[key];return c?{...base,accent:c,soft:`color-mix(in srgb, ${c} 15%, var(--surface))`,ink:`color-mix(in srgb, ${c} 72%, var(--ink))`}:base}

function localEstimate(text){const t=text.toLocaleLowerCase('es');const has=(...w)=>w.some(x=>t.includes(x));let template=has('correo','email','mail')?'email':has('comprar','retirar','pagar')?'errand':has('cita','reunión','reunion','hora','dentista')?'appointment':has('whatsapp','mensaje')?'message':has('decidir','elegir','comparar')?'decision':has('pdf','documento','informe','antecedentes','archivo')?'document':'general';let mins=t.match(/\b(\d{1,3})\s*(?:m|min|mins|minuto|minutos)\b/i)?.[1];let hrs=t.match(/\b(\d+(?:[.,]\d+)?)\s*(?:h|hora|horas)\b/i)?.[1];let base={email:12,appointment:15,errand:25,document:30,decision:20,message:6,general:15}[template];let complexity=(t.match(/\b(y|luego|después|además|también)\b/g)||[]).length*4+(t.split(/\s+/).length>16?8:0);let minutes=mins?Number(mins):hrs?Math.round(Number(hrs.replace(',','.'))*60):Math.ceil((base+complexity)/5)*5;return{minutes:Math.max(2,Math.min(480,minutes)),reason:mins||hrs?'Usé el tiempo que indicaste.':'Estimé el trabajo activo por tipo y alcance.',template,priority:has('hoy','urgente','ahora','vence')?'high':'normal',bucket:has('esperando','a la espera','depende de')?'waiting':has('algún día','algun dia','quizás','quizas')?'someday':has('leer','revisar pdf','revisar informe')?'read':has('hoy','urgente','ahora','vence')?'now':'later',source:'local'} }
function headers(){return{'Content-Type':'application/json',...(bridge.apiKey.trim()?{'X-SinRutina-Key':bridge.apiKey.trim()}:{}),'X-SinRutina-Device':device}}
function apiUrl(path){return bridge.mode==='api'&&bridge.baseUrl.trim()?bridge.baseUrl.trim().replace(/\/$/,'')+path:path}
async function jsonFetch(url,opt={},ms=6000){const c=new AbortController(),to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok||!r.headers.get('content-type')?.includes('application/json'))return null;return await r.json()}finally{clearTimeout(to)}}
function browserLM(){return globalThis.LanguageModel}
async function onDeviceEstimate(text){const LM=browserLM();if(!LM)return null;let session;try{const avail=await LM.availability({expectedInputs:[{type:'text',languages:['es']}],expectedOutputs:[{type:'text',languages:['es']}]});if(avail!=='available')return null;session=await LM.create({expectedInputs:[{type:'text',languages:['es']}],expectedOutputs:[{type:'text',languages:['es']}]});const raw=await session.prompt(`Devuelve JSON sin markdown. Clasifica esta tarea en español. Estima trabajo activo 2-480 min. Campos: minutes number, reason string, template uno de document,email,errand,appointment,message,decision,general; priority low,normal,high; bucket now,later,waiting,someday,read. Tarea: ${text}`);const j=JSON.parse(raw.replace(/^```(?:json)?\s*|\s*```$/g,''));if(!j.minutes||!j.template)return null;return{...localEstimate(text),...j,minutes:Math.max(2,Math.min(480,Number(j.minutes))),source:'on-device'}}catch{return null}finally{session?.destroy?.()}}
async function estimateTask(text){const local=localEstimate(text);try{const j=await jsonFetch(apiUrl('/api/estimate-duration'),{method:'POST',headers:headers(),body:JSON.stringify({title:text,memory:memoryPrompt('steps',false)})},5500);if(j?.minutes&&j.engine!=='local-api')return calibratedEstimate({...local,...j,minutes:Math.max(2,Math.min(480,Number(j.minutes)||local.minutes)),source:'ai'});if(j?.minutes&&j.engine==='local-api'){const d=await onDeviceEstimate(text);if(d)return calibratedEstimate(d)}}catch{}return calibratedEstimate(await onDeviceEstimate(text)||local)}
function localAssist(mode,context){
 const n=context.split(/\n|[.!?]/)[0].trim().replace(/^(necesito|tengo que|hay que|quiero)\s+/i,'')||'este asunto',w=memory.profile?.writing||{};
 const greeting=w.opening==='estimado'?'Estimado/a [nombre]:':w.opening==='directo'?'':'Hola [nombre],';
 const closing=w.closing==='gracias'?'Muchas gracias.':w.closing==='directo'?'':'Saludos,\n[tu nombre]';
 if(mode==='email'){
  const core=w.lengthLabel==='breve'?`Quería coordinar ${n}. ¿Me confirmas cuando puedas?`:`Quería coordinar lo siguiente: ${n}.\n\n¿Podrías revisarlo y avisarme si falta algún antecedente?`;
  return{title:'Correo listo para revisar',subject:n.charAt(0).toUpperCase()+n.slice(1,96),text:[greeting,core,closing].filter(Boolean).join('\n\n')};
 }
 if(mode==='whatsapp')return{title:'WhatsApp breve',subject:'',text:`${w.opening==='directo'?'': 'Hola, '}${n}. ¿Me confirmas cuando puedas?${w.closing==='gracias'?' Gracias.':''}`};
 if(mode==='steps')return{title:'Pasos concretos',subject:'',text:`1. Abre solo lo necesario (2 min).\n2. Reúne la información mínima.\n3. Haz una primera versión sin corregir.\n4. Revisa datos y termina o envía.`};
 if(mode==='summary'){let arr=context.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(x=>x.length>18).slice(0,4);return{title:'Resumen',subject:'',text:`${(arr.length?arr:[context.slice(0,500)]).map(x=>'• '+x).join('\n')}\n\nSiguiente paso: confirma el dato principal y conviértelo en una acción.`}}
 return{title:'Decisión simplificada',subject:'',text:`Para “${n}”, prioriza la opción que reduzca más fricción y sea reversible.\n\nCriterios sugeridos:\n• impacto\n• costo de equivocarte\n• reversibilidad\n\nPróximo paso: limita la decisión a 10 minutos y elige con la información actual.`}
}
async function onDeviceAssist(mode,context){const LM=browserLM();if(!LM)return null;let sess;try{const a=await LM.availability({expectedInputs:[{type:'text',languages:['es']}],expectedOutputs:[{type:'text',languages:['es']}]});if(a!=='available')return null;sess=await LM.create({expectedInputs:[{type:'text',languages:['es']}],expectedOutputs:[{type:'text',languages:['es']}]});const instructions={email:'redacta un correo humano, claro y sobrio con asunto y cuerpo; usa corchetes si falta un dato',whatsapp:'redacta un WhatsApp natural, breve y cálido',steps:'divide el objetivo en 3 a 7 pasos concretos; el primero debe tomar menos de 10 minutos',decide:'expón criterios, costos, riesgos, recomendación provisional y próximo paso sin decidir por la persona',summary:'resume fielmente en puntos y termina con un próximo paso; no inventes'}[mode];const mem=memoryPrompt(mode,true);const raw=await sess.prompt(`Devuelve JSON sin markdown con title, subject y text. En español: ${instructions}.\n${mem}\nContexto del pedido:\n${context}`);const j=JSON.parse(raw.replace(/^```(?:json)?\s*|\s*```$/g,''));return j?.text?{...j,source:'on-device'}:null}catch{return null}finally{sess?.destroy?.()}}
async function assist(mode,context){const local=localAssist(mode,context),mem=memoryPrompt(mode,false);try{const j=await jsonFetch(apiUrl('/api/assist'),{method:'POST',headers:headers(),body:JSON.stringify({mode,context,memory:mem})},8000);if(j?.result?.text&&j.engine!=='local-api')return{...j.result,source:'integrated'};if(j?.result?.text&&j.engine==='local-api'){const d=await onDeviceAssist(mode,context);if(d)return d}}catch{}return await onDeviceAssist(mode,context)||{...local,source:'local'}}

function taskStyle(t,prefix='task'){const th=themeFor(t);return`--${prefix}-accent:${th.accent};--${prefix}-soft:${th.soft};--${prefix}-ink:${th.ink}`}
function nav(){return`<nav class="dock" aria-label="Navegación principal"><button type="button" class="nav-btn ${ui.view==='now'?'active':''}" data-action="go-now" aria-current="${ui.view==='now'?'page':'false'}"><span class="nav-glyph now-glyph">${icon('now')}</span><span>Ahora</span></button><button type="button" class="capture-btn" data-action="capture-open" aria-label="Capturar">${icon('plus')}</button><button type="button" class="nav-btn ${ui.view==='trays'?'active':''}" data-action="go-trays" aria-current="${ui.view==='trays'?'page':'false'}"><span class="nav-glyph trays-glyph">${icon('trays')}</span><span>Bandejas</span></button></nav>`}
function topbar(){return`<header class="home-head fixed-app-header"><div class="brand-lockup">${logoMark()}<div class="home-titles"><span class="app-label">SinRutina</span><h1>Ahora</h1><p class="home-date">${esc(formatDate())}</p></div></div><div class="header-actions"><button class="ai-global-btn" data-action="global-ai-open" aria-label="Abrir IA" title="IA">${icon('spark')}</button><button class="top-more glass-control" data-action="settings-open" aria-label="Ajustes">${icon('more')}</button></div></header>`}
function renderNow(){const t=currentTask();let main;if(t){const th=themeFor(t);main=`<section class="now-hero-wrap"><article class="now-stage" style="${taskStyle(t)}"><div class="now-orb now-orb-a"></div><div class="now-orb now-orb-b"></div><div class="now-meta"><span class="kind-label"><i></i>Tu siguiente paso · ${esc(th.label)}</span><button class="task-more glass-control" data-action="task-open" data-id="${esc(t.id)}" aria-label="Más acciones">${icon('more')}</button></div><div class="now-task-copy"><h2 class="now-task-title">${esc(t.title)}</h2>${prefs.showReason?`<p class="task-reason">${esc(taskReason(t))}</p>`:''}</div><div class="now-actions"><span class="now-estimate">${icon('clock')}<b>${t.duration} min</b></span><button class="start-btn" data-action="start" data-id="${esc(t.id)}">${icon('play')}Empezar</button></div></article><button class="saturated-card" data-action="cant" data-id="${esc(t.id)}"><span class="saturated-symbol">${icon('spark')}</span><span><strong>Estoy saturado</strong><small>Hazlo más pequeño o dame otra cosa.</small></span>${icon('chevron')}</button></section>`}else{main=`<section class="now-hero-wrap"><article class="now-stage empty"><div class="now-meta"><span class="kind-label"><i></i>Sin presión</span></div><div class="empty-copy"><h2>No hay nada que tengas que empezar.</h2><p>Si aparece algo, sácalo de tu cabeza. Sin organizarlo primero.</p></div><button class="empty-capture" data-action="capture-open">${icon('plus')}Capturar algo</button></article></section>`}return`<main class="view now-view">${topbar()}${main}<div class="home-context"><button class="context-row" data-action="context-open"><span class="context-copy"><strong>Contexto</strong><small>${prefs.available} min disponibles · ${esc(energyLabel())}</small></span><span class="context-mini">Ajustar</span>${icon('chevron')}</button></div></main>`}
function taskRow(t){const th=themeFor(t);const label=t.completed?'Hecha':th.label;return`<button class="task-row" data-action="task-open" data-id="${esc(t.id)}" style="--row-soft:${th.soft};--row-ink:${th.ink};--row-accent:${th.accent}"><span class="task-check ${t.completed?'done':''}">${t.completed?icon('check'):''}</span><span class="task-row-copy"><strong>${esc(t.title)}</strong><small>${esc(label)}${t.attachmentNames?.length?` · ${t.attachmentNames.length} adj.`:''}</small></span><span class="task-row-time">${t.completed?'':`${t.duration} min`}</span></button>`}
function bucketTasks(bucket){return bucket==='done'?tasks.filter(t=>t.completed).sort((a,b)=>new Date(b.completedAt||b.updatedAt)-new Date(a.completedAt||a.updatedAt)):tasks.filter(t=>!t.completed&&t.bucket===bucket).sort((a,b)=>taskScore(b)-taskScore(a))}

function renderTaskDetail(){const t=tasks.find(x=>x.id===ui.taskId);if(!t)return'';const th=themeFor(t);return sheetWrap(`${sheetHead('Tarea')}<div class="task-detail-hero"><small>${esc(th.label)}</small><h2>${esc(t.title)}</h2><div class="task-detail-meta"><span class="meta-chip">~${t.duration} min</span><span class="meta-chip">${esc(t.priority==='high'?'prioridad alta':t.priority==='low'?'prioridad baja':'prioridad normal')}</span>${t.attachmentNames?.length?`<span class="meta-chip">${t.attachmentNames.length} adjunto${t.attachmentNames.length===1?'':'s'}</span>`:''}</div></div><button class="sheet-primary" data-action="start" data-id="${esc(t.id)}">${icon('play')}Empezar</button><div class="sheet-section"><div class="action-list"><button class="action-item" data-action="ai-open" data-id="${esc(t.id)}"><span class="setting-icon ai">${icon('spark')}</span><span class="action-copy"><strong>Ayúdame con IA</strong><small>Correo, WhatsApp, pasos, decidir o resumir.</small></span>${icon('chevron')}</button><button class="action-item" data-action="send-open" data-id="${esc(t.id)}"><span class="setting-icon share">${icon('share')}</span><span class="action-copy"><strong>Enviar a…</strong><small>Recordatorios, Calendario, Mail o Compartir.</small></span>${icon('chevron')}</button><button class="action-item" data-action="edit-open" data-id="${esc(t.id)}"><span class="setting-icon">${icon('edit')}</span><span class="action-copy"><strong>Editar detalles</strong><small>Título, duración, prioridad y bandeja.</small></span>${icon('chevron')}</button></div></div><div class="sheet-section"><div class="two-col"><button class="sheet-secondary" data-action="postpone" data-id="${esc(t.id)}">${icon('clock')}Luego</button><button class="sheet-secondary danger" data-action="delete" data-id="${esc(t.id)}">${icon('trash')}Eliminar</button></div></div>`)}

function paletteBase(p,dark=false){const defaults=dark?{bg:'#1C1C1E',surface:'#2C2C2E',surface2:'#3A3A3C',ink:'#F2F2F7',muted:'#AEAEB2',line:'#48484A',accent:'#8FA7C0',accentInk:'#C6D3DF',accentSoft:'#313A43',start:'#8FA7C0',note:'#303034',success:'#8CAD98',warning:'#D0AF7A',danger:'#D08E8B'}:{bg:'#F5F5F3',surface:'#FFFFFF',surface2:'#F0F0EE',ink:'#242424',muted:'#747474',line:'#E1E1DE',accent:'#8099B3',accentInk:'#526F8C',accentSoft:'#E9EEF3',start:'#7891AA',note:'#F2EBD8',success:'#7FA18B',warning:'#C5A26B',danger:'#C67F7C'};return{...defaults,...(dark?p.dark:p.light)}}
function renderAppearance(){const p=palettes[prefs.palette]||palettes.apple,c=prefs.colors||{},systemDark=prefs.mode==='system'&&matchMedia?.('(prefers-color-scheme: dark)')?.matches,dark=prefs.mode==='dark'||systemDark,fallback=paletteBase(p,dark);return sheetWrap(`${sheetHead('Apariencia','Paletas completas, planas y suaves. Cada tema ajusta fondo, superficies, texto y acentos.')}<div class="preview-strip"><span class="pv-kicker">Ahora</span><span class="pv-time">~15 min</span><span class="pv-title">Una sola cosa</span><span class="pv-start">Empezar</span></div><div class="sheet-section"><span class="sheet-label">Paletas</span><div class="palette-grid">${Object.entries(palettes).map(([k,v])=>`<button class="palette-card ${prefs.palette===k?'active':''}" data-action="palette" data-value="${k}" aria-label="Paleta ${esc(v.label)}"><span class="palette-card-top"><span class="palette-card-copy"><strong>${esc(v.label)}</strong><small>${esc(v.subtitle)}</small></span><span class="palette-check">${icon('check')}</span></span><span class="palette-chips">${v.chips.map(col=>`<i class="palette-chip" style="background:${col}"></i>`).join('')}</span></button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Modo</span><div class="choice-row">${[['light','Claro'],['system','Sistema'],['dark','Oscuro']].map(([v,l])=>`<button class="choice ${prefs.mode===v?'active':''}" data-action="pref" data-key="mode" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Tamaño y espacio</span><div class="choice-row">${[['small','Pequeño'],['normal','Normal'],['large','Grande']].map(([v,l])=>`<button class="choice ${prefs.textSize===v?'active':''}" data-action="pref" data-key="textSize" data-value="${v}">${l}</button>`).join('')}</div><div class="choice-row" style="margin-top:7px">${[['compact','Compacta'],['balanced','Equilibrada'],['airy','Aireada']].map(([v,l])=>`<button class="choice ${prefs.density===v?'active':''}" data-action="pref" data-key="density" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Forma</span><div class="choice-row">${[['soft','Discreta'],['balanced','iOS'],['round','Redonda']].map(([v,l])=>`<button class="choice ${prefs.radius===v?'active':''}" data-action="pref" data-key="radius" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Navegación</span><div class="choice-row">${[['labels','Iconos + texto'],['icons','Solo iconos']].map(([v,l])=>`<button class="choice ${prefs.navlabels===v?'active':''}" data-action="pref" data-key="navlabels" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Peso tipográfico</span><div class="choice-row">${[['light','Ligero'],['regular','Normal'],['semibold','Más firme']].map(([v,l])=>`<button class="choice ${prefs.fontWeight===v?'active':''}" data-action="pref" data-key="fontWeight" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Superficies</span><div class="choice-row">${[['separated','Agrupadas'],['plain','Planos tipo Mail']].map(([v,l])=>`<button class="choice ${prefs.surfaceStyle===v?'active':''}" data-action="pref" data-key="surfaceStyle" data-value="${v}">${l}</button>`).join('')}</div></div><div class="sheet-section"><span class="sheet-label">Información en Ahora</span><div class="choice-row"><button class="choice ${!prefs.showReason?'active':''}" data-action="reason" data-value="false">Mínima</button><button class="choice ${prefs.showReason?'active':''}" data-action="reason" data-value="true">Explicar elección</button></div></div><div class="sheet-section"><span class="sheet-label">Ajuste fino de color</span><div class="color-list">${colorRow('Fondo','bg',c.bg||fallback.bg,'Pantallas y bandejas')}${colorRow('Superficie','surface',c.surface||fallback.surface,'Listas y hojas')}${colorRow('Superficie secundaria','surface2',c.surface2||fallback.surface2,'Campos y estados suaves')}${colorRow('Texto','ink',c.ink||fallback.ink,'Títulos y contenido')}${colorRow('Texto secundario','muted',c.muted||fallback.muted,'Fechas y metadatos')}${colorRow('Separadores','line',c.line||fallback.line,'Líneas de listas')}${colorRow('Acento','accent',c.accent||fallback.accent,'Navegación y controles')}${colorRow('Acento suave','accentSoft',c.accentSoft||fallback.accentSoft,'Selecciones y captura')}${colorRow('Botón Empezar','start',c.start||fallback.start,'Acción principal')}${colorRow('Fondo de Ahora','note',c.note||fallback.note,'La tarea actual')}${colorRow('Correcto','success',c.success||fallback.success,'Conexión y estados positivos')}${colorRow('Aviso','warning',c.warning||fallback.warning,'Estados de atención')}${colorRow('Peligro','danger',c.danger||fallback.danger,'Eliminar y acciones destructivas')}</div></div><div class="sheet-section"><span class="sheet-label">Color por tipo de tarea</span><div class="color-list">${['document','email','errand','appointment','message','decision','general'].map(templateColorRow).join('')}</div></div><button class="color-reset" data-action="colors-reset">Quitar ajustes manuales de color</button><button class="design-reset" data-action="design-reset">Restablecer diseño predeterminado</button>`) }
function shortcutRecipe(tab){const api=bridge.baseUrl.trim().replace(/\/$/,'')||'[URL HTTPS DE TU API]',key=bridge.apiKey.trim()||'[TU CLAVE]',pwa=bridge.publicUrl.trim().replace(/\/$/,'')||'[URL HTTPS DE TU PWA]';if(bridge.mode==='deeplink'){if(tab==='natural')return`CAPTURAR EN SINRUTINA\n\n1. Dicta texto en español.\n2. Si está vacío, termina.\n3. Genera un UUID.\n4. Codifica el texto para URL.\n5. Abre:\n${pwa}/?sr_action=capture&sr_id=[UUID]&text=[Texto codificado]&source=shortcut\n\nAñádelo a Siri o al botón de acción.`;if(tab==='next')return`ABRIR SINRUTINA AHORA\n\nAbre esta URL:\n${pwa}/?view=now\n\nPara que Siri lea la tarea sin abrir la app, usa API bidireccional.`;return`Esta automatización necesita API bidireccional para leer y devolver cambios sin depender de una pestaña abierta. Cambia el modo a API, prueba la conexión y vuelve aquí.`}
const h=`Encabezado: X-SinRutina-Key = ${key}`;if(tab==='natural')return`HABLAR CON SINRUTINA\n\n1. Dicta texto en español.\n2. Obtener contenido de URL:\n${api}/api/shortcut/tasks/natural\nMétodo POST\n${h}\nJSON: text = Texto\n3. Lee task.title y task.duration.\n4. Muestra: “[title] · [duration] min”.`;
if(tab==='next')return`¿QUÉ HAGO AHORA?\n\n1. Obtener contenido de URL:\n${api}/api/shortcut/tasks/next\nMétodo GET\n${h}\n2. Si task existe, lee: “Ahora toca [task.title]. Tomará [task.duration] minutos”.`;
if(tab==='mail')return`MAIL → TAREA → BORRADOR\n\n1. Crea un Atajo desde Compartir que acepte Correo, Texto y Enlaces.\n2. Extrae asunto, remitente, contenido y fecha cuando existan.\n3. POST ${api}/api/shortcut/mail/capture\n${h}\nJSON: subject, sender, preview, receivedAt, account.\n4. Muestra task.title y task.duration.\n5. Para responder, abre la tarea en SinRutina → IA → Correo → Mail. Nunca envíes automáticamente.`;
if(tab==='reminders')return`SINRUTINA ↔ RECORDATORIOS\n\n1. Usa una lista dedicada “SinRutina”.\n2. Lee hasta 50 recordatorios y crea diccionarios con externalId, title, dueAt, completed, notes y updatedAt.\n3. POST ${api}/api/shortcut/sync\n${h}\nJSON: source=reminders, scope=reminders:SinRutina, fullSnapshot=true, items, since.\n4. Aplica response.outgoing por externalId o marker: upsert, complete o delete.\n5. Guarda response.cursor solo si todo terminó bien.\n6. Automatiza 07:00 y 19:00.`;
return`SINRUTINA ↔ CALENDARIO\n\n1. Usa un calendario dedicado “SinRutina”.\n2. Lee hasta 50 eventos desde hoy a +90 días con externalId, title, dueAt, endAt, notes y updatedAt.\n3. POST ${api}/api/shortcut/sync\n${h}\nJSON: source=calendar, scope=calendar:SinRutina, fullSnapshot=true, items, since.\n4. Aplica response.outgoing: upsert, delete o complete.\n5. Guarda response.cursor solo si todo terminó bien.\n6. Automatiza 07:05 y 19:05.`}

async function readAttachmentSmart(file){

    if(file.type.startsWith('text/')||/\.(txt|md|csv)$/i.test(name)){const text=cleanExtractedText(await file.text());return text?{status:'ready',detail:'Texto extraído',text}:{status:'metadata',detail:'Archivo sin texto',text:''}}

      try{const pdfjs=await loadPdfLib(),doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,parts=[],limit=Math.min(doc.numPages,18);for(let p=1;p<=limit;p++){const page=await doc.getPage(p),tc=await page.getTextContent(),t=tc.items.map(x=>x.str||'').join(' ');if(t.trim())parts.push(t);if(parts.join('\n').length>24000)break}const text=cleanExtractedText(parts.join('\n'));try{await doc.destroy()}catch{}return text?{status:'ready',detail:`Texto extraído de ${Math.min(doc.numPages,limit)} página${doc.numPages===1?'':'s'}`,text}:{status:'metadata',detail:'PDF añadido; no encontré texto seleccionable',text:''}}catch{return{status:'metadata',detail:'PDF añadido · la extracción de texto requiere conexión',text:''}}
    }
    if(name.endsWith('.docx')){try{const mammoth=await loadMammoth(),r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}),text=cleanExtractedText(r.value);return text?{status:'ready',detail:'Texto del Word extraído',text}:{status:'metadata',detail:'Word añadido; sin texto legible',text:''}}catch{return{status:'metadata',detail:'Word añadido · la extracción de texto requiere conexión',text:''}}}
    if(name.endsWith('.doc'))return{status:'metadata',detail:'Word .doc añadido; conviértelo a .docx para leer su texto',text:''};
    if(file.type.startsWith('image/')){const TD=globalThis.TextDetector;if(TD&&'createImageBitmap'in globalThis){const bm=await createImageBitmap(file);try{const text=cleanExtractedText((await new TD().detect(bm)).map(x=>x.rawValue||'').join('\n'));return text?{status:'ready',detail:'Texto visible de la imagen extraído',text}:{status:'metadata',detail:'Imagen añadida; no detecté texto visible',text:''}}finally{bm.close()}}return{status:'metadata',detail:'Imagen añadida; usaré el nombre y tu instrucción',text:''}}
    return{status:'metadata',detail:'Archivo añadido; usaré el nombre y tu instrucción',text:''};
  }catch{return{status:'error',detail:'No se pudo leer; el archivo sigue añadido por su nombre',text:''}}
}

/* Stable viewport guard: iOS no desplaza el documento ni hace pinch/gesture zoom. */
const lockDocumentViewport=()=>{
  if(window.scrollX!==0||window.scrollY!==0) window.scrollTo(0,0);
};
window.addEventListener('scroll',lockDocumentViewport,{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});

/* Evita el rubber-band del documento en iOS sin bloquear el scroll útil de vistas y hojas. */
let stableTouchY=0;
let stableTouchX=0;
document.addEventListener('touchstart',e=>{
  if(e.touches?.length===1){stableTouchY=e.touches[0].clientY;stableTouchX=e.touches[0].clientX;}
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!e.touches||e.touches.length!==1){e.preventDefault();return;}
  const target=e.target instanceof Element?e.target:null;
  if(!target){e.preventDefault();return;}
  const dx=e.touches[0].clientX-stableTouchX;
  const dy=e.touches[0].clientY-stableTouchY;
  const horizontal=target.closest('.tray-tabs,.ai-tabs,.segment-scroll');
  if(horizontal && Math.abs(dx)>Math.abs(dy)) return;
  const scroller=target.closest('.view,.sheet,.code-box');
  if(!scroller){e.preventDefault();return;}
  const canScroll=scroller.scrollHeight>scroller.clientHeight+1;
  if(!canScroll){e.preventDefault();return;}
  const atTop=scroller.scrollTop<=0;
  const atBottom=Math.ceil(scroller.scrollTop+scroller.clientHeight)>=scroller.scrollHeight;
  if((atTop&&dy>0)||(atBottom&&dy<0)) e.preventDefault();
},{passive:false});

window.addEventListener('orientationchange',()=>setTimeout(lockDocumentViewport,80),{passive:true});
window.visualViewport?.addEventListener('resize',lockDocumentViewport,{passive:true});
window.visualViewport?.addEventListener('scroll',lockDocumentViewport,{passive:true});
